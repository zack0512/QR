<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code 全能工具</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML5-QRCode Library (Scanner) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- QRCode.js Library (Generator) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Fix html5-qrcode video element styling to ensure video fills container and aligns with overlay */
        #reader {
            border: none !important;
            width: 100% !important;
            height: 100% !important;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 1rem;
        }
        #reader__scan_region {
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }
        #reader__dashboard {
            display: none !important;
        }
        /* Laser scanning animation */
        .scan-laser {
            position: absolute;
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, rgba(59,130,246,0) 0%, rgba(59,130,246,1) 50%, rgba(59,130,246,0) 100%);
            box-shadow: 0 0 15px #3b82f6;
            animation: scanning 2.5s infinite ease-in-out;
        }
        @keyframes scanning {
            0% { top: 0%; opacity: 0.8; }
            50% { top: 98%; opacity: 1; }
            100% { top: 0%; opacity: 0.8; }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 bg-slate-800/90 border border-slate-700/80 text-slate-100 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-md">
        <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message" class="text-sm font-medium">提示訊息</span>
    </div>

    <!-- Main Container -->
    <div class="max-w-xl w-full mx-auto p-4 sm:p-6 flex-grow flex flex-col justify-center">
        
        <!-- Header -->
        <header class="text-center mb-6">
            <div class="inline-flex items-center justify-center p-3.5 bg-blue-600/15 text-blue-400 rounded-2xl mb-3 ring-1 ring-blue-500/30 shadow-lg shadow-blue-500/10">
                <i data-lucide="qr-code" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">QR Code 雙向全能工具</h1>
            <p class="text-slate-400 text-sm mt-1">即時掃描解析 & 客製化 QR Code 生成</p>
        </header>

        <!-- Main Navigation (Scan vs Generate) -->
        <div class="bg-slate-900/80 p-1.5 rounded-2xl flex gap-1.5 mb-6 border border-slate-800 backdrop-blur-md shadow-inner">
            <button id="nav-scan" onclick="switchNavMode('scan')" class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-200 bg-blue-600 text-white shadow-lg shadow-blue-600/30">
                <i data-lucide="scan-line" class="w-4 h-4"></i>
                掃描 QR Code
            </button>
            <button id="nav-generate" onclick="switchNavMode('generate')" class="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                生成 QR Code
            </button>
        </div>

        <!-- Dynamic Card Container -->
        <main class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-4 sm:p-6 backdrop-blur-xl shadow-2xl relative">
            
            <!-- ==================== MODE 1: SCANNER ==================== -->
            <div id="section-scan-wrapper">
                <!-- Sub Tab: Camera vs File Upload -->
                <div class="bg-slate-950/60 p-1 rounded-xl flex gap-1 mb-5 border border-slate-800/60">
                    <button id="tab-camera" onclick="switchScanTab('camera')" class="flex-1 py-2 rounded-lg text-xs font-medium transition-all bg-slate-800 text-white flex items-center justify-center gap-1.5">
                        <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                        相機掃描
                    </button>
                    <button id="tab-file" onclick="switchScanTab('file')" class="flex-1 py-2 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5">
                        <i data-lucide="image" class="w-3.5 h-3.5"></i>
                        圖片解析
                    </button>
                </div>

                <!-- Camera Sub-section -->
                <section id="camera-section" class="flex flex-col items-center">
                    <div class="relative w-full aspect-square max-w-sm rounded-2xl overflow-hidden bg-slate-950 border border-slate-800/80 flex items-center justify-center shadow-inner">
                        <div id="reader" class="w-full h-full"></div>
                        
                        <!-- Overlay Frame -->
                        <div id="scanner-overlay" class="absolute inset-0 pointer-events-none hidden z-10 border-2 border-blue-500/30 rounded-2xl overflow-hidden">
                            <div class="scan-laser"></div>
                            <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-blue-500"></div>
                            <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-blue-500"></div>
                            <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-blue-500"></div>
                            <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-blue-500"></div>
                        </div>

                        <!-- Camera Placeholder -->
                        <div id="camera-placeholder" class="flex flex-col items-center gap-3 p-6 text-center text-slate-400">
                            <i data-lucide="camera-off" class="w-12 h-12 text-slate-600"></i>
                            <p class="text-xs sm:text-sm">點擊下方按鈕啟動相機開始掃描</p>
                        </div>
                    </div>

                    <!-- Camera Controls -->
                    <div class="flex flex-wrap items-center justify-center gap-3 mt-5 w-full">
                        <button id="btn-toggle-camera" onclick="toggleCamera()" class="flex-1 min-w-[140px] flex items-center justify-center gap-2 py-3 px-5 rounded-xl font-medium bg-blue-600 hover:bg-blue-500 active:scale-95 text-white transition-all shadow-lg shadow-blue-600/20 text-sm">
                            <i data-lucide="power" class="w-4 h-4"></i>
                            <span id="btn-camera-text">開啟相機</span>
                        </button>
                        <button id="btn-switch-cam" onclick="switchCamera()" class="hidden p-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 transition-all border border-slate-700" title="切換鏡頭">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        </button>
                        <button id="btn-torch" onclick="toggleTorch()" class="hidden p-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 transition-all border border-slate-700" title="開啟閃光燈">
                            <i data-lucide="zap" class="w-4 h-4"></i>
                        </button>
                    </div>
                </section>

                <!-- File Sub-section -->
                <section id="file-section" class="hidden flex-col items-center">
                    <div id="drop-zone" onclick="document.getElementById('file-input').click()" class="w-full aspect-square max-w-sm rounded-2xl border-2 border-dashed border-slate-700 hover:border-blue-500 bg-slate-950/40 hover:bg-slate-950 transition-all cursor-pointer flex flex-col items-center justify-center p-6 text-center group relative overflow-hidden">
                        <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                        
                        <div id="upload-preview-container" class="hidden absolute inset-0 bg-slate-950 flex items-center justify-center p-2">
                            <img id="upload-preview" class="max-w-full max-h-full object-contain rounded-lg" src="" alt="預覽圖片">
                        </div>

                        <div id="upload-prompt" class="flex flex-col items-center gap-3">
                            <div class="p-4 rounded-2xl bg-slate-800/80 text-slate-400 group-hover:scale-110 group-hover:text-blue-400 group-hover:bg-blue-500/10 transition-all duration-300">
                                <i data-lucide="upload-cloud" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-slate-200">點擊上傳 或 拖放圖片至此</p>
                                <p class="text-xs text-slate-500 mt-1">支援 PNG, JPG, WEBP 等格式</p>
                            </div>
                        </div>
                    </div>

                    <button onclick="document.getElementById('file-input').click()" class="mt-4 w-full max-w-sm flex items-center justify-center gap-2 py-3 px-5 rounded-xl font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 transition-all text-sm">
                        <i data-lucide="file-plus" class="w-4 h-4"></i>
                        選擇圖片檔案
                    </button>
                </section>

                <!-- Scan Result Box -->
                <section id="scan-result-card" class="hidden mt-6 pt-5 border-t border-slate-800">
                    <div class="flex items-center justify-between mb-2.5">
                        <span class="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center gap-1.5">
                            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                            解析成功結果
                        </span>
                        <span id="scan-time" class="text-[11px] text-slate-500">Just now</span>
                    </div>

                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 mb-3.5 break-all text-sm font-mono text-slate-200 max-h-32 overflow-y-auto leading-relaxed" id="scan-result-text">
                        --
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="copyScanResult()" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl font-medium bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-100 transition-all text-sm">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                            複製內容
                        </button>
                        <a id="btn-open-link" href="#" target="_blank" rel="noopener noreferrer" class="hidden flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl font-medium bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white transition-all text-sm shadow-lg shadow-emerald-600/20">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                            開啟連結
                        </a>
                    </div>
                </section>
            </div>

            <!-- ==================== MODE 2: GENERATOR ==================== -->
            <div id="section-generate-wrapper" class="hidden flex-col">
                <form onsubmit="event.preventDefault(); generateQRCode();" class="space-y-4">
                    
                    <!-- Content Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center gap-1.5">
                            <i data-lucide="type" class="w-3.5 h-3.5 text-blue-400"></i>
                            輸入文字或網址 URL
                        </label>
                        <textarea id="gen-input" rows="3" placeholder="例如：https://example.com 或 任何文字內容..." class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none font-mono" oninput="debounceGenerate()"></textarea>
                    </div>

                    <!-- Customization Options Accordion/Grid -->
                    <div class="bg-slate-950/50 border border-slate-800/80 rounded-2xl p-4 space-y-4">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">進階視覺與參數設定</span>
                        
                        <!-- Colors -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">前景色 (QR Code)</label>
                                <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                                    <input type="color" id="gen-color-fg" value="#000000" onchange="generateQRCode()" class="w-8 h-8 rounded-lg border-0 bg-transparent cursor-pointer">
                                    <span id="gen-color-fg-val" class="text-xs font-mono text-slate-300">#000000</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">背景色</label>
                                <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                                    <input type="color" id="gen-color-bg" value="#ffffff" onchange="generateQRCode()" class="w-8 h-8 rounded-lg border-0 bg-transparent cursor-pointer">
                                    <span id="gen-color-bg-val" class="text-xs font-mono text-slate-300">#ffffff</span>
                                </div>
                            </div>
                        </div>

                        <!-- Size & Error Correction -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">尺寸大小</label>
                                <select id="gen-size" onchange="generateQRCode()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <option value="180">小 (180px)</option>
                                    <option value="250" selected>中 (250px)</option>
                                    <option value="320">大 (320px)</option>
                                    <option value="400">特大 (400px)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">容錯等級 (ECC)</label>
                                <select id="gen-ecc" onchange="generateQRCode()" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <option value="L">L - 低 (7%)</option>
                                    <option value="M" selected>M - 中 (15%)</option>
                                    <option value="Q">Q - 高 (25%)</option>
                                    <option value="H">H - 極高 (30% 建議有Logo)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Logo Overlay -->
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">嵌入中央 Logo 圖片 (可選)</label>
                            <div class="flex items-center gap-2">
                                <input type="file" id="gen-logo-input" accept="image/*" class="hidden" onchange="handleLogoSelect(event)">
                                <button type="button" onclick="document.getElementById('gen-logo-input').click()" class="flex-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 flex items-center justify-center gap-1.5 transition-colors">
                                    <i data-lucide="image-plus" class="w-3.5 h-3.5"></i>
                                    <span id="gen-logo-name">選擇 Logo 圖片</span>
                                </button>
                                <button type="button" id="btn-remove-logo" onclick="removeLogo()" class="hidden p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-xl transition-colors" title="移除 Logo">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                    </div>
                </form>

                <!-- Output Display Area -->
                <div id="gen-output-container" class="mt-6 flex flex-col items-center">
                    <div class="p-4 bg-white rounded-2xl shadow-xl flex items-center justify-center relative min-w-[200px] min-h-[200px]" id="qr-canvas-wrapper">
                        <div id="qrcode-render"></div>
                        <div id="gen-placeholder" class="absolute text-slate-400 text-xs text-center p-4">
                            輸入內容即可自動生成 QR Code
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div id="gen-actions" class="hidden grid-cols-2 gap-3 mt-5 w-full max-w-sm">
                        <button onclick="downloadQRCode()" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium bg-blue-600 hover:bg-blue-500 active:scale-95 text-white transition-all text-sm shadow-lg shadow-blue-600/20">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            下載圖檔 (PNG)
                        </button>
                        <button onclick="copyGeneratedImage()" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-medium bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 transition-all text-sm border border-slate-700">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                            複製圖檔
                        </button>
                    </div>
                </div>
            </div>

        </main>

        <!-- History Section (Shared Component) -->
        <section class="mt-6 bg-slate-900/20 border border-slate-800/60 rounded-3xl p-4 sm:p-5">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 text-slate-400"></i>
                    <span id="history-title">掃描歷史紀錄</span>
                </h2>
                <button onclick="clearCurrentHistory()" class="text-xs text-slate-500 hover:text-rose-400 transition-colors">清除全部</button>
            </div>
            <div id="history-list" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                <p id="history-empty" class="text-xs text-slate-500 text-center py-4">尚無歷史紀錄</p>
            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-600">
        QR Code All-in-One Utility &bull; Powered by HTML5-QRCode & QRCode.js
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        // Mode State
        let currentNavMode = 'scan'; // 'scan' | 'generate'
        
        // Scanner State
        let html5QrCode = null;
        let isScanning = false;
        let currentFacingMode = "environment";
        let isTorchOn = false;
        let currentScanResult = "";
        let scanHistory = JSON.parse(localStorage.getItem('qr_scan_history') || '[]');

        // Generator State
        let qrcodeObj = null;
        let logoImageObj = null;
        let debounceTimer = null;
        let genHistory = JSON.parse(localStorage.getItem('qr_gen_history') || '[]');

        // Global Initialization
        window.addEventListener('DOMContentLoaded', () => {
            html5QrCode = new Html5Qrcode("reader");
            renderHistory();
            setupDragAndDrop();

            // Color picker value sync
            document.getElementById('gen-color-fg').addEventListener('input', (e) => {
                document.getElementById('gen-color-fg-val').textContent = e.target.value;
            });
            document.getElementById('gen-color-bg').addEventListener('input', (e) => {
                document.getElementById('gen-color-bg-val').textContent = e.target.value;
            });
        });

        // 1. Navigation Switch (Scan vs Generate)
        function switchNavMode(mode) {
            currentNavMode = mode;
            const navScan = document.getElementById('nav-scan');
            const navGen = document.getElementById('nav-generate');
            const secScan = document.getElementById('section-scan-wrapper');
            const secGen = document.getElementById('section-generate-wrapper');
            const historyTitle = document.getElementById('history-title');

            if (mode === 'scan') {
                navScan.className = "flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-200 bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                navGen.className = "flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";
                secScan.classList.remove('hidden');
                secGen.classList.add('hidden');
                historyTitle.textContent = "掃描歷史紀錄";
            } else {
                navGen.className = "flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-200 bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                navScan.className = "flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";
                secGen.classList.remove('hidden');
                secScan.classList.add('hidden');
                historyTitle.textContent = "生成歷史紀錄";
                
                // Stop camera if currently scanning
                if (isScanning) stopCamera();
            }

            renderHistory();
        }

        // ==================== SCANNER LOGIC ==================== //

        function switchScanTab(tab) {
            const btnCam = document.getElementById('tab-camera');
            const btnFile = document.getElementById('tab-file');
            const secCam = document.getElementById('camera-section');
            const secFile = document.getElementById('file-section');

            if (tab === 'camera') {
                btnCam.className = "flex-1 py-2 rounded-lg text-xs font-medium transition-all bg-slate-800 text-white flex items-center justify-center gap-1.5";
                btnFile.className = "flex-1 py-2 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5";
                secCam.classList.remove('hidden');
                secCam.classList.add('flex');
                secFile.classList.add('hidden');
            } else {
                btnFile.className = "flex-1 py-2 rounded-lg text-xs font-medium transition-all bg-slate-800 text-white flex items-center justify-center gap-1.5";
                btnCam.className = "flex-1 py-2 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5";
                secFile.classList.remove('hidden');
                secFile.classList.add('flex');
                secCam.classList.add('hidden');
                if (isScanning) stopCamera();
            }
        }

        async function toggleCamera() {
            if (isScanning) {
                await stopCamera();
            } else {
                await startCamera();
            }
        }

        async function startCamera() {
            const btnText = document.getElementById('btn-camera-text');
            const placeholder = document.getElementById('camera-placeholder');
            const overlay = document.getElementById('scanner-overlay');
            const btnSwitch = document.getElementById('btn-switch-cam');

            try {
                const config = { 
                    fps: 10,
                    aspectRatio: 1.0,
                    qrbox: (w, h) => {
                        const min = Math.min(w, h);
                        return { width: Math.floor(min * 0.8), height: Math.floor(min * 0.8) };
                    }
                };

                await html5QrCode.start(
                    { facingMode: currentFacingMode },
                    config,
                    onScanSuccess,
                    () => {}
                );

                isScanning = true;
                btnText.textContent = "關閉相機";
                placeholder.classList.add('hidden');
                overlay.classList.remove('hidden');
                btnSwitch.classList.remove('hidden');
                checkTorchSupport();

            } catch (err) {
                console.error("相機權限錯誤:", err);
                showToast("無法開啟相機，請確認已授予權限", "error");
            }
        }

        async function stopCamera() {
            if (!html5QrCode || !isScanning) return;

            const btnText = document.getElementById('btn-camera-text');
            const placeholder = document.getElementById('camera-placeholder');
            const overlay = document.getElementById('scanner-overlay');
            const btnSwitch = document.getElementById('btn-switch-cam');
            const btnTorch = document.getElementById('btn-torch');

            try {
                await html5QrCode.stop();
                isScanning = false;
                btnText.textContent = "開啟相機";
                placeholder.classList.remove('hidden');
                overlay.classList.add('hidden');
                btnSwitch.classList.add('hidden');
                btnTorch.classList.add('hidden');
                isTorchOn = false;
            } catch (err) {
                console.error("停止相機失敗:", err);
            }
        }

        async function switchCamera() {
            if (!isScanning) return;
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            await stopCamera();
            await startCamera();
        }

        function checkTorchSupport() {
            const btnTorch = document.getElementById('btn-torch');
            try {
                const capabilities = html5QrCode.getRunningTrackCapabilities();
                if (capabilities.torch) {
                    btnTorch.classList.remove('hidden');
                } else {
                    btnTorch.classList.add('hidden');
                }
            } catch (e) {
                btnTorch.classList.add('hidden');
            }
        }

        async function toggleTorch() {
            if (!isScanning) return;
            isTorchOn = !isTorchOn;
            try {
                await html5QrCode.applyVideoConstraints({
                    advanced: [{ torch: isTorchOn }]
                });
                showToast(isTorchOn ? "已開啟閃光燈" : "已關閉閃光燈");
            } catch (err) {
                showToast("無法切換閃光燈", "error");
            }
        }

        function onScanSuccess(decodedText) {
            handleScanResult(decodedText);
            playBeepSound();
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function handleScanResult(text) {
            currentScanResult = text;

            const card = document.getElementById('scan-result-card');
            const resultTextEl = document.getElementById('scan-result-text');
            const btnOpenLink = document.getElementById('btn-open-link');
            const scanTimeEl = document.getElementById('scan-time');

            resultTextEl.textContent = text;
            scanTimeEl.textContent = new Date().toLocaleTimeString();
            card.classList.remove('hidden');

            if (isValidUrl(text)) {
                btnOpenLink.href = text;
                btnOpenLink.classList.remove('hidden');
                btnOpenLink.classList.add('flex');
            } else {
                btnOpenLink.classList.add('hidden');
            }

            addHistoryItem('scan', text);
        }

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const preview = document.getElementById('upload-preview');
            const previewContainer = document.getElementById('upload-preview-container');
            const reader = new FileReader();

            reader.onload = function(e) {
                preview.src = e.target.result;
                previewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);

            try {
                const result = await html5QrCode.scanFile(file, true);
                handleScanResult(result);
                showToast("圖片解析成功！");
            } catch (err) {
                showToast("圖片中未偵測到 QR Code", "error");
            }
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
                dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
            });
            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    document.getElementById('file-input').files = files;
                    handleFileSelect({ target: { files: files } });
                }
            });
        }

        function copyScanResult(text = currentScanResult) {
            if (!text) return;
            copyToClipboard(text);
        }

        // ==================== GENERATOR LOGIC ==================== //

        function debounceGenerate() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                generateQRCode();
            }, 300);
        }

        function generateQRCode() {
            const text = document.getElementById('gen-input').value.trim();
            const renderContainer = document.getElementById('qrcode-render');
            const placeholder = document.getElementById('gen-placeholder');
            const actions = document.getElementById('gen-actions');

            renderContainer.innerHTML = '';

            if (!text) {
                placeholder.classList.remove('hidden');
                actions.classList.add('hidden');
                actions.classList.remove('grid');
                return;
            }

            placeholder.classList.add('hidden');
            actions.classList.remove('hidden');
            actions.classList.add('grid');

            const size = parseInt(document.getElementById('gen-size').value, 10);
            const colorFg = document.getElementById('gen-color-fg').value;
            const colorBg = document.getElementById('gen-color-bg').value;
            const eccLevel = document.getElementById('gen-ecc').value;

            // Map ECC Level string to QRCode.CorrectLevel
            let correctLevel = QRCode.CorrectLevel.M;
            if (eccLevel === 'L') correctLevel = QRCode.CorrectLevel.L;
            if (eccLevel === 'Q') correctLevel = QRCode.CorrectLevel.Q;
            if (eccLevel === 'H') correctLevel = QRCode.CorrectLevel.H;

            // Generate using QRCode.js
            qrcodeObj = new QRCode(renderContainer, {
                text: text,
                width: size,
                height: size,
                colorDark: colorFg,
                colorLight: colorBg,
                correctLevel: correctLevel
            });

            // If Logo is attached, draw overlay after image/canvas renders
            setTimeout(() => {
                if (logoImageObj) {
                    overlayLogoOnCanvas(size, colorBg);
                }
            }, 50);

            addHistoryItem('gen', text);
        }

        function handleLogoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    logoImageObj = img;
                    document.getElementById('gen-logo-name').textContent = file.name;
                    document.getElementById('btn-remove-logo').classList.remove('hidden');
                    generateQRCode();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeLogo() {
            logoImageObj = null;
            document.getElementById('gen-logo-input').value = '';
            document.getElementById('gen-logo-name').textContent = '選擇 Logo 圖片';
            document.getElementById('btn-remove-logo').classList.add('hidden');
            generateQRCode();
        }

        function overlayLogoOnCanvas(qrSize, bgColor) {
            const renderContainer = document.getElementById('qrcode-render');
            const imgEl = renderContainer.querySelector('img');
            const canvasEl = renderContainer.querySelector('canvas');

            let canvas;
            if (canvasEl) {
                canvas = canvasEl;
            } else if (imgEl) {
                // Convert img to canvas for manipulation
                canvas = document.createElement('canvas');
                canvas.width = qrSize;
                canvas.height = qrSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgEl, 0, 0, qrSize, qrSize);
            } else {
                return;
            }

            const ctx = canvas.getContext('2d');
            const logoSize = Math.floor(qrSize * 0.22); // 22% of QR size
            const x = (qrSize - logoSize) / 2;
            const y = (qrSize - logoSize) / 2;

            // Draw white/background padding box for logo
            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(x - 3, y - 3, logoSize + 6, logoSize + 6, 6);
            ctx.fill();

            // Draw Logo
            ctx.drawImage(logoImageObj, x, y, logoSize, logoSize);

            // Replace render container with updated canvas
            renderContainer.innerHTML = '';
            renderContainer.appendChild(canvas);
        }

        function getGeneratedCanvas() {
            const container = document.getElementById('qrcode-render');
            const canvas = container.querySelector('canvas');
            if (canvas) return canvas;

            const img = container.querySelector('img');
            if (img) {
                const c = document.createElement('canvas');
                c.width = img.naturalWidth || 250;
                c.height = img.naturalHeight || 250;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0);
                return c;
            }
            return null;
        }

        function downloadQRCode() {
            const canvas = getGeneratedCanvas();
            if (!canvas) {
                showToast("無可下載的 QR Code", "error");
                return;
            }

            const link = document.createElement('a');
            link.download = `qrcode_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast("已開始下載圖檔！");
        }

        async function copyGeneratedImage() {
            const canvas = getGeneratedCanvas();
            if (!canvas) return;

            try {
                canvas.toBlob(async (blob) => {
                    if (!blob) return;
                    try {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        showToast("已將 QR Code 圖片複製到剪貼簿！");
                    } catch (e) {
                        // Fallback: Copy content text
                        copyToClipboard(document.getElementById('gen-input').value.trim());
                    }
                });
            } catch (err) {
                showToast("無法複製圖片", "error");
            }
        }

        // ==================== SHARED & HISTORY LOGIC ==================== //

        function addHistoryItem(type, text) {
            const targetHistory = type === 'scan' ? scanHistory : genHistory;
            const storageKey = type === 'scan' ? 'qr_scan_history' : 'qr_gen_history';

            if (targetHistory.length > 0 && targetHistory[0].text === text) return;

            const item = {
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                isUrl: isValidUrl(text)
            };

            targetHistory.unshift(item);
            if (targetHistory.length > 10) targetHistory.pop();

            localStorage.setItem(storageKey, JSON.stringify(targetHistory));
            renderHistory();
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            const emptyEl = document.getElementById('history-empty');
            const activeHistory = currentNavMode === 'scan' ? scanHistory : genHistory;

            if (activeHistory.length === 0) {
                emptyEl.classList.remove('hidden');
                listEl.innerHTML = '';
                listEl.appendChild(emptyEl);
                return;
            }

            emptyEl.classList.add('hidden');
            listEl.innerHTML = activeHistory.map((item) => `
                <div class="flex items-center justify-between p-2.5 bg-slate-950/80 rounded-xl border border-slate-800 text-xs">
                    <div class="flex-1 overflow-hidden mr-2 cursor-pointer" onclick="onHistoryItemClick('${escapeHtml(item.text)}')">
                        <p class="font-mono text-slate-300 truncate">${escapeHtml(item.text)}</p>
                        <p class="text-[10px] text-slate-500 mt-0.5">${item.time}</p>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="copyToClipboard('${escapeHtml(item.text)}')" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-slate-200 transition-colors" title="複製">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        </button>
                        ${item.isUrl ? `
                            <a href="${escapeHtml(item.text)}" target="_blank" class="p-1.5 hover:bg-slate-800 rounded-lg text-blue-400 hover:text-blue-300 transition-colors" title="開啟連結">
                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            </a>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function onHistoryItemClick(text) {
            if (currentNavMode === 'scan') {
                handleScanResult(text);
            } else {
                document.getElementById('gen-input').value = text;
                generateQRCode();
            }
        }

        function clearCurrentHistory() {
            if (currentNavMode === 'scan') {
                scanHistory = [];
                localStorage.removeItem('qr_scan_history');
            } else {
                genHistory = [];
                localStorage.removeItem('qr_gen_history');
            }
            renderHistory();
            showToast("歷史紀錄已清除");
        }

        // Helpers
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("已複製內容到剪貼簿！");
            } catch (err) {
                showToast("複製失敗", "error");
            }
            document.body.removeChild(textarea);
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;

            if (type === 'error') {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.className = "w-5 h-5 text-rose-400";
            } else {
                toastIcon.setAttribute('data-lucide', 'check-circle');
                toastIcon.className = "w-5 h-5 text-emerald-400";
            }
            lucide.createIcons();

            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
